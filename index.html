<!doctype html>

<html lang="pt-BR">
  <head>
    <!-- Configurações básicas da página -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Informações sobre a página -->
    <meta name="description" content="Criação de um sistema bancário" />
    <meta name="keywords" content="Sistema, Bancário" />
    <meta
      name="author"
      content="Larissa Fernandes Coelho & Gilvam J. T. de Oliveira"
    />

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />

    <!-- Ícone da página -->
    <link
      rel="icon"
      href="assets/img/icons8-cadastro-16.png"
      type="image/x-icon"
    />

    <title>Cadastro de Conta</title>
  </head>

  <body>
    <h1>Cadastro de Conta</h1>

    <form id="formulario">
      <label>Nome:</label>
      <input type="text" id="nome" required />

      <label>Número da conta:</label>
      <input type="number" id="conta" required />

      <label>Agência:</label>
      <input type="number" id="agencia" required />

      <label>Saldo:</label>
      <input type="number" id="saldo" min="0" required />

      <button type="submit">Criar conta</button>
    </form>

    <div id="resultado"></div>

    <!-- Arquivo JavaScript -->
    <script src="assets/js/script.js"></script>
  </body>
</html>
